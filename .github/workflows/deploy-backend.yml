name: Deploy backend

on:
  workflow_dispatch:
    inputs:
      migration:
        description: Migration file to run (leave empty to skip)
        default: 0005_finn_keys.sql
        required: false
      functions:
        description: Edge functions to deploy, separated by spaces
        default: finn
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: rlupbwqnpesdtkhuhpsr
    steps:
      - uses: actions/checkout@v4

      - name: Run migration
        if: ${{ inputs.migration != '' }}
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$DB_URL" || { echo "Add the SUPABASE_DB_URL secret first"; exit 1; }
          sudo apt-get install -y -q postgresql-client > /dev/null
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "supabase/migrations/${{ inputs.migration }}"

      - uses: supabase/setup-cli@v1
        if: ${{ inputs.functions != '' }}
        with:
          version: latest

      - name: Deploy edge functions
        if: ${{ inputs.functions != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Add the SUPABASE_ACCESS_TOKEN secret first"; exit 1; }
          for f in ${{ inputs.functions }}; do
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" --use-api
          done
