name: Keep Supabase awake

on:
  schedule:
    - cron: '17 9 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        env:
          SUPABASE_URL: https://rlupbwqnpesdtkhuhpsr.supabase.co
          SUPABASE_KEY: sb_publishable_K2KxEnlwLvwCtgdPHb9tuQ_RLrkWEeg
        run: |
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/username_available" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"name":"keepalive"}'
